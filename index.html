<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>2nd Quarter | Drill 2</title>
    <style>
        body { background: linear-gradient(135deg, #e0eafc, #cfdef3); min-height: 100vh; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
        .card-header { border-radius: 1rem 1rem 0 0 !important; }
        #output { font-size: 18px; }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 760px;">
        <h2 class="text-center fw-bold mb-4">🎓 Student Club Member Manager</h2>

        <!-- Input card: two text boxes + button -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white fs-5">Add new club member:</div>
            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
                    </div>
                    <div class="mb-3">
                        <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
                    </div>
                    <!-- PyScript event: click calls result_checker() in main.py -->
                    <input type="button" value="Submit" py-click="result_checker" class="btn btn-success w-100">
                </form>
            </div>
        </div>

        <!-- Output card: Python writes the roster HTML here -->
        <div class="card">
            <div class="card-header bg-dark text-white fs-5">Club Roster</div>
            <div id="output" class="card-body"></div>
        </div>
    </div>

    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
